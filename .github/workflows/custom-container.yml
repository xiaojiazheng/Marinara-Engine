name: Build Custom Container

on:
  push:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xiaojiazheng/Marinara-Engine' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/xiaojiazheng/marinara-engine:custom-${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=custom
          labels: |
            org.opencontainers.image.source=https://github.com/xiaojiazheng/Marinara-Engine
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=custom-amd64
          cache-to: type=gha,mode=max,scope=custom-amd64
      - name: Record release reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo '### Custom image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/xiaojiazheng/marinara-engine:custom-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/xiaojiazheng/marinara-engine@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
